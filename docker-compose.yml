services:
  neo4j:
    image: neo4j:5.18.0
    container_name: neo4j_graph
    restart: always
    ports:
      - "7474:7474" # Interface web (Neo4j Browser)
      - "7687:7687" # Port Bolt pour le code
    environment:
      # `:?` fait échouer `docker compose up` avec un message explicite plutôt
      # que de démarrer avec des identifiants vides.
      - NEO4J_AUTH=${NEO4J_USERNAME:?NEO4J_USERNAME manquant dans .env}/${NEO4J_PASSWORD:?NEO4J_PASSWORD manquant dans .env}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_vector
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-grossiste_mada}
      POSTGRES_RAG_DB: ${POSTGRES_RAG_DB:-grossiste_rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    container_name: rag_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - DB_RAG_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_RAG_DB:-grossiste_rag}
      - DB_BUSINESS_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-grossiste_mada}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-grossiste-mada}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_started

volumes:
  pgdata:
  neo4j_data:
  pgadmin_data:
